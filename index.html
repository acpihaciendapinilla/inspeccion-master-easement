<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Inspección Master Easement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Source+Sans+3:wght@400;500;600;700&display=swap">
<style>
/* Layout: una sola columna pensada para el celular en campo; tarjetas solo donde hay algo que tocar. Tema claro fijo (fondo blanco por pedido). */
:root{
  color-scheme: light;
  --bg:#ffffff;
  --surface:#f7f7f0;
  --line:#e3e3d4;
  --ink:#2f2f0e;
  --muted:#6b6b52;
  --olive:#9a9a54;
  --olive-dark:#6f6f33;
  --olive-soft:#eeeedd;
  --ok:#3f7a3a; --ok-bg:#e7f1e3;
  --bad:#a46a12; --bad-bg:#fbefd9;
  --urg:#b3261e; --urg-bg:#fbe4e1;
  --na:#6b6b6b; --na-bg:#eeeeee;
  --display:"Cormorant Garamond", Georgia, "Times New Roman", serif;
  --body:"Source Sans 3", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --r:12px;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:12px 120px}
h1,h2,h3{margin:0;text-wrap:balance}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--olive);outline-offset:2px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}

/* Barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:10px;display:flex;align-items:center;gap:12px;min-height:56px}
.top-in img{height:26px;width:auto}
.top-title{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{border:0;background:none;color:var(--olive-dark);font-weight:600;padding:8px 4px}

/* Inicio */
.home{display:flex;flex-direction:column;align-items:center;text-align:center;gap:20px;padding-top:28px}
.home img{width:min(280px,80%)}
.home h1{font-family:var(--display);font-size:34px;font-weight:600;line-height:1.1}
.stack{display:flex;flex-direction:column;gap:12px;width:100%}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:var(--r);border:1px solid var(--olive-dark);background:var(--olive-dark);color:#fff;font-weight:600;font-size:17px;padding:12px 16px}
.btn.sec{background:var(--bg);color:var(--olive-dark)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted);font-weight:500;min-height:44px;font-size:15px}
.btn.danger{background:var(--urg);border-color:var(--urg)}
.btn:disabled{background:var(--line);border-color:var(--line);color:var(--muted);cursor:not-allowed}
.resume{width:100%;text-align:left;background:var(--olive-soft);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px}

/* Formularios */
label.f{display:flex;flex-direction:column;gap:6px;text-align:left;font-weight:600}
input[type=text],textarea{font:inherit;width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--bg);color:var(--ink)}
textarea{min-height:76px;resize:vertical}

/* Ruta */
.summary{display:flex;flex-direction:column;gap:8px;padding-block:8px 16px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--olive);border-radius:99px;transition:width .3s}
.route{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.stop{display:flex;gap:14px;align-items:stretch}
.rail{display:flex;flex-direction:column;align-items:center;width:28px;flex:none}
.dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:var(--bg);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--muted)}
.rail::after{content:"";flex:1;width:2px;background:var(--line);margin-block:2px}
.stop:last-child .rail::after{display:none}
.stop.done .dot{background:var(--olive);border-color:var(--olive);color:#fff}
.stop.cur .dot{border-color:var(--olive-dark);color:var(--olive-dark)}
.stop-btn{flex:1;min-width:0;text-align:left;background:none;border:0;padding:2px 0 22px;color:inherit;display:flex;flex-direction:column;gap:2px}
.stop-btn strong{font-size:17px}
.stop.cur .stop-btn strong{color:var(--olive-dark)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;border-radius:99px;padding:3px 10px;width:fit-content}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.urg{background:var(--urg-bg);color:var(--urg)}
.pill.na{background:var(--na-bg);color:var(--na)}
.pill.prog{background:var(--olive-soft);color:var(--olive-dark)}

/* Sitio */
.site-head{display:flex;flex-direction:column;gap:6px;padding-block:6px 14px}
.site-head h2{font-family:var(--display);font-size:30px;font-weight:600;line-height:1.1}
.cat{margin-top:18px;display:flex;flex-direction:column;gap:10px}
.cat>h3{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--olive-dark)}
.item{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--bg)}
.item.complete{border-color:var(--olive)}
.item-top{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.item-top div{min-width:0}
.item-sub{font-size:13px;color:var(--muted)}
.item-name{font-weight:600;font-size:17px}
.check{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:#fff;font-size:14px}
.item.complete .check{background:var(--olive);border-color:var(--olive)}
.states{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.st{min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:14px;font-weight:600;padding:4px 2px;line-height:1.15}
.st[aria-pressed=true].ok{background:var(--ok);border-color:var(--ok);color:#fff}
.st[aria-pressed=true].bad{background:var(--bad);border-color:var(--bad);color:#fff}
.st[aria-pressed=true].urg{background:var(--urg);border-color:var(--urg);color:#fff}
.st[aria-pressed=true].na{background:var(--na);border-color:var(--na);color:#fff}
.extra{display:flex;flex-direction:column;gap:10px}
.req{font-size:13px;color:var(--urg);font-weight:600}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.ph{position:relative;width:84px;height:84px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph button{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:15px;line-height:1}
.addph{width:84px;height:84px;border-radius:10px;border:1.5px dashed var(--olive);background:var(--olive-soft);color:var(--olive-dark);font-weight:600;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative}
.addph input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* Barra inferior fija */
.foot{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.foot-in{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:12px;display:flex;flex-direction:column;gap:8px}
.foot-note{font-size:14px;color:var(--muted);text-align:center}
.confirm{background:var(--olive-soft);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* Bloqueado / resumen */
.locked{display:flex;gap:10px;align-items:center;background:var(--olive-soft);border-radius:var(--r);padding:12px 14px;font-weight:600;color:var(--olive-dark)}
.ro{display:flex;flex-direction:column;gap:6px;padding-block:12px;border-bottom:1px solid var(--line)}
.ro:last-child{border-bottom:0}
.ro .photos .ph{width:64px;height:64px}

/* Final */
.final{display:flex;flex-direction:column;gap:18px;text-align:center;align-items:center;padding-top:24px}
.seal{width:76px;height:76px;border-radius:50%;background:var(--olive);color:#fff;display:grid;place-items:center;font-size:38px}
.final h2{font-family:var(--display);font-size:32px;font-weight:600}
.stats{width:100%;display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:var(--r)}
.stats div{padding:12px 4px;display:flex;flex-direction:column;gap:2px}
.stats div+div{border-left:1px solid var(--line)}
.stats b{font-size:22px}
.stats span{font-size:12px;color:var(--muted)}
.times{width:100%;display:flex;justify-content:space-between;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding-block:10px;font-size:15px}

/* Historial */
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.hist li{padding-block:14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.hist-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.hist .btn{min-height:44px;font-size:15px}
.empty{text-align:center;padding:40px 8px;color:var(--muted)}
.note-example{font-size:13px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

/* ===================== Almacenamiento (en el celular) ===================== */
const DB = (() => {
  let dbp = null; const mem = {};
  function open(){
    if (dbp) return dbp;
    dbp = new Promise((res) => {
      try{
        const r = indexedDB.open("inspeccion-me", 1);
        r.onupgradeneeded = () => r.result.createObjectStore("kv");
        r.onsuccess = () => res(r.result);
        r.onerror = () => res(null);
      }catch(e){ res(null); }
    });
    return dbp;
  }
  async function get(k){
    const db = await open(); if(!db) return mem[k];
    return new Promise(res => { try{ const q=db.transaction("kv").objectStore("kv").get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>res(mem[k]); }catch(e){res(mem[k]);} });
  }
  async function set(k,v){
    mem[k]=v; const db = await open(); if(!db) return;
    return new Promise(res => { try{ const t=db.transaction("kv","readwrite"); t.objectStore("kv").put(v,k); t.oncomplete=()=>res(); t.onerror=()=>res(); }catch(e){res();} });
  }
  async function del(k){
    delete mem[k]; const db = await open(); if(!db) return;
    return new Promise(res => { try{ const t=db.transaction("kv","readwrite"); t.objectStore("kv").delete(k); t.oncomplete=()=>res(); t.onerror=()=>res(); }catch(e){res();} });
  }
  return {get,set,del};
})();
const LS = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
};

/* ===================== Estado ===================== */
let R = null;          // recorrido en curso
let HIST = [];         // historial (resumen + datos)
let view = {name:"home"};
let saveTimer = null;
function guardar(){ clearTimeout(saveTimer); saveTimer = setTimeout(()=>DB.set("actual", R), 250); }

const pad = n => String(n).padStart(2,"0");
const hoyISO = () => { const d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); };
const hora = iso => { if(!iso) return "--:--"; const d=new Date(iso); return pad(d.getHours())+":"+pad(d.getMinutes()); };
const fechaLarga = f => { const [y,m,d]=f.split("-").map(Number); return new Date(y,m-1,d).toLocaleDateString("es-CR",{weekday:"long",day:"numeric",month:"long",year:"numeric"}); };
const fechaCorta = f => { const [y,m,d]=f.split("-"); return d+"/"+m+"/"+y; };
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function nuevoRecorrido(inspector){
  const sitios = {};
  SITIOS.forEach(s => { sitios[s.id] = {inicio:null, fin:null, confirmado:false, items:{}}; });
  return {id:"r"+Date.now(), inspector, fecha:hoyISO(), creado:new Date().toISOString(), sitios, ejemplo:EJEMPLO};
}
function itemCompleto(d){
  if(!d || !d.estado) return false;
  if(NECESITA_EVIDENCIA(d.estado)) return (d.comentario||"").trim().length>0 && (d.fotos||[]).length>0;
  return true;
}
function avanceSitio(s){
  const st = R.sitios[s.id]; const n = s.items.length;
  const hechos = s.items.filter(it => itemCompleto(st.items[it.id])).length;
  return {hechos, n};
}
function conteos(rec){
  const c = {bueno:0,malo:0,urgente:0,na:0,total:0};
  SITIOS.forEach(s => s.items.forEach(it => { const d=rec.sitios[s.id]?.items[it.id]; if(d&&d.estado){c[d.estado]++; c.total++;} }));
  return c;
}
function inicioFin(rec){
  const ini = SITIOS.map(s=>rec.sitios[s.id]?.inicio).filter(Boolean).sort()[0]||null;
  const fin = SITIOS.map(s=>rec.sitios[s.id]?.fin).filter(Boolean).sort().pop()||null;
  return {ini,fin};
}
const sitiosConfirmados = () => SITIOS.filter(s=>R.sitios[s.id].confirmado).length;
const siguienteSitio = () => SITIOS.find(s=>!R.sitios[s.id].confirmado);

/* ===================== Interfaz ===================== */
const $app = document.getElementById("app");
const $top = document.getElementById("top");
const $foot = document.getElementById("foot");
const $footIn = document.getElementById("footIn");

function toast(msg){
  const t=document.getElementById("toast"); t.textContent=msg; t.hidden=false;
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,2600);
}
function setTop(title, back){
  if(!title){ $top.hidden=true; return; }
  $top.hidden=false; document.getElementById("topTitle").textContent=title;
  document.getElementById("backBtn").onclick = back;
}
function setFoot(html){
  if(!html){ $foot.hidden=true; $footIn.innerHTML=""; return; }
  $foot.hidden=false; $footIn.innerHTML=html;
}
function go(v){ view=v; render(); window.scrollTo(0,0); }

function render(){
  if(view.name==="home") return vHome();
  if(view.name==="start") return vStart();
  if(view.name==="route") return vRoute();
  if(view.name==="site") return vSite(view.id);
  if(view.name==="final") return vFinal();
  if(view.name==="hist") return vHist();
}

/* ---------- Inicio ---------- */
function vHome(){
  setTop(null); setFoot(null);
  let resume = "";
  if(R){
    const sig = siguienteSitio();
    resume = `<div class="resume">
      <span class="eyebrow">Recorrido en curso</span>
      <strong>${esc(R.inspector)} · ${fechaCorta(R.fecha)}</strong>
      <span class="muted">${sitiosConfirmados()} de ${SITIOS.length} sitios terminados${sig?` · sigue ${esc(sig.nombre)}`:""}</span>
    </div>`;
  }
  $app.innerHTML = `<section class="home">
    <img src="${LOGO}" alt="Hacienda Pinilla">
    <div><p class="eyebrow">Inspección en campo</p><h1>Master Easement</h1></div>
    ${resume}
    <div class="stack">
      ${R ? `<button class="btn" id="bCont" type="button">Continuar recorrido</button>`
          : `<button class="btn" id="bIni" type="button">Iniciar recorrido</button>`}
      <button class="btn sec" id="bHist" type="button">Ver recorridos hechos</button>
    </div>
    ${EJEMPLO?`<p class="note-example">Versión de prueba: los ítems de cada sitio son de ejemplo y se van a reemplazar por la lista real de la ruta.</p>`:""}
  </section>`;
  const bi=document.getElementById("bIni"); if(bi) bi.onclick=()=>go({name:"start"});
  const bc=document.getElementById("bCont"); if(bc) bc.onclick=()=>go(R && sitiosConfirmados()===SITIOS.length?{name:"final"}:{name:"route"});
  document.getElementById("bHist").onclick=()=>go({name:"hist"});
}

/* ---------- Datos del inspector ---------- */
function vStart(){
  setTop("Nuevo recorrido", ()=>go({name:"home"}));
  const last = LS.get("inspector")||"";
  $app.innerHTML = `<section class="stack" style="padding-top:16px">
    <div><p class="eyebrow">Paso previo</p><h2 style="font-family:var(--display);font-size:28px">¿Quién hace el recorrido?</h2></div>
    <label class="f" for="insp">Nombre del inspector
      <input id="insp" type="text" autocomplete="name" value="${esc(last)}" placeholder="Nombre y apellido">
    </label>
    <div class="note-example">Fecha: <strong>${fechaLarga(hoyISO())}</strong>. Se registra sola, igual que la hora de inicio y fin de cada sitio.</div>
    <div class="note-example">Ruta: ${SITIOS.map(s=>esc(s.nombre)).join(" → ")}</div>
  </section>`;
  setFoot(`<button class="btn" id="bGo" type="button">Comenzar recorrido</button>`);
  const inp=document.getElementById("insp");
  const btn=document.getElementById("bGo");
  const upd=()=>btn.disabled=!inp.value.trim(); upd(); inp.oninput=upd;
  btn.onclick=()=>{
    const n=inp.value.trim(); if(!n) return;
    LS.set("inspector",n); R=nuevoRecorrido(n); guardar(); go({name:"route"});
  };
}

/* ---------- Ruta ---------- */
function vRoute(){
  setTop("Ruta del día", ()=>go({name:"home"}));
  const done=sitiosConfirmados(); const sig=siguienteSitio();

/* ---------- Sitio ---------- */
function agrupar(items){
  const g = {}; items.forEach(it => (g[it.cat] ||= []).push(it)); return g;
}
function itemHTML(s,it){
  const st=R.sitios[s.id]; const d=st.items[it.id]||{};
  const comp=itemCompleto(d); const need=NECESITA_EVIDENCIA(d.estado);
  const fotos=d.fotos||[];
  let extra="";
  if(need){
    const faltas=[]; if(!(d.comentario||"").trim()) faltas.push("comentario"); if(!fotos.length) faltas.push("al menos 1 foto");
    extra=`<div class="extra">
      <label class="f" for="c-${it.id}" style="font-weight:600;font-size:15px">¿Qué se encontró?
        <textarea id="c-${it.id}" data-c="${it.id}" placeholder="Describe el daño o lo que hay que resolver">${esc(d.comentario||"")}</textarea>
      </label>
      <div class="photos">
        ${fotos.map((f,i)=>`<div class="ph"><img src="${f.src}" alt="Foto ${i+1} de ${esc(it.nombre)}"><button type="button" aria-label="Quitar foto" data-del="${it.id}" data-i="${i}">×</button></div>`).join("")}
        ${fotos.length<MAX_FOTOS?`<label class="addph"><span style="font-size:22px;line-height:1">+</span>Foto ${fotos.length+1}/${MAX_FOTOS}<input type="file" accept="image/*" data-ph="${it.id}" aria-label="Agregar foto"></label>`:""}
      </div>
      ${faltas.length?`<span class="req">Falta: ${faltas.join(" y ")}</span>`:""}
    </div>`;
  } else if(d.estado){
    extra=`<details ${d.comentario?"open":""}><summary class="muted" style="font-size:14px;cursor:pointer">Agregar comentario (opcional)</summary>
      <textarea id="c-${it.id}" data-c="${it.id}" style="margin-top:8px" placeholder="Comentario">${esc(d.comentario||"")}</textarea></details>`;
  }
  return `<article class="item ${comp?"complete":""}" id="it-${it.id}">
    <div class="item-top"><div><div class="item-sub">${esc(it.sub)}</div><div class="item-name">${esc(it.nombre)}</div></div><span class="check" aria-hidden="true">${comp?"✓":""}</span></div>
    <div class="states" role="group" aria-label="Estado de ${esc(it.nombre)}">
      ${Object.entries(ESTADOS).map(([k,e])=>`<button type="button" class="st ${e.cls}" aria-pressed="${d.estado===k}" data-it="${it.id}" data-e="${k}">${e.txt}</button>`).join("")}
    </div>${extra}</article>`;
}
function vSite(id){
  const s=SITIOS.find(x=>x.id===id); const st=R.sitios[id];
  setTop(s.nombre, ()=>go({name:"route"}));
  if(st.confirmado) return vSiteLocked(s);
  const a=avanceSitio(s);
  $app.innerHTML = `<section class="site-head">
      <p class="eyebrow">Sitio ${SITIOS.indexOf(s)+1} de ${SITIOS.length}</p>
      <h2>${esc(s.nombre)}</h2>
      <span class="muted tnum" id="siteMeta">${metaSitio(s)}</span>
    </section>
    ${Object.entries(agrupar(s.items)).map(([cat,its])=>`<section class="cat"><h3>${esc(cat)}</h3>${its.map(it=>itemHTML(s,it)).join("")}</section>`).join("")}`;
  bindSite(s);
  footSite(s);
}
function metaSitio(s){
  const st=R.sitios[s.id]; const a=avanceSitio(s);
  return `${a.hechos} de ${a.n} ítems listos${st.inicio?` · inició ${hora(st.inicio)}`:""}`;
}
function footSite(s, confirmando){
  const a=avanceSitio(s);
  if(confirmando){
    setFoot(`<div class="confirm"><strong>¿Terminaste ${esc(s.nombre)}?</strong><span class="muted">Al confirmar se registra la hora de fin y el sitio queda bloqueado para no cambiar nada.</span>
      <div class="row2"><button class="btn sec" id="cNo" type="button">Revisar</button><button class="btn" id="cYes" type="button">Sí, terminar</button></div></div>`);
    document.getElementById("cNo").onclick=()=>footSite(s);
    document.getElementById("cYes").onclick=()=>confirmarSitio(s);
    return;
  }
  const falta=a.n-a.hechos;
  setFoot(`${falta?`<span class="foot-note">Faltan ${falta} ${falta===1?"ítem":"ítems"} por completar</span>`:""}
    <button class="btn" id="bConf" type="button" ${falta?"disabled":""}>Confirmar sitio terminado</button>`);
  document.getElementById("bConf").onclick=()=>footSite(s,true);
}
function refrescarItem(s,itId){
  const it=s.items.find(x=>x.id===itId);
  const el=document.getElementById("it-"+itId);
  const tmp=document.createElement("div"); tmp.innerHTML=itemHTML(s,it);
  el.replaceWith(tmp.firstElementChild);
  bindSite(s);
  document.getElementById("siteMeta").textContent=metaSitio(s);
  footSite(s);
}
function tocarSitio(s){
  const st=R.sitios[s.id];
  if(!st.inicio) st.inicio=new Date().toISOString();
}
function bindSite(s){
  const st=R.sitios[s.id];
  $app.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>{
    const itId=b.dataset.it; const d=(st.items[itId] ||= {fotos:[],comentario:""});
    d.estado=b.dataset.e; tocarSitio(s); guardar(); refrescarItem(s,itId);
  });
  $app.querySelectorAll("[data-c]").forEach(t=>t.oninput=()=>{
    const itId=t.dataset.c; const d=(st.items[itId] ||= {fotos:[],comentario:""});
    const antes=itemCompleto(d); d.comentario=t.value; guardar();
    if(antes!==itemCompleto(d)){ const pos=t.selectionStart; refrescarItem(s,itId); const n=document.getElementById("c-"+itId); if(n){n.focus(); try{n.setSelectionRange(pos,pos);}catch(e){}} }
  });
  $app.querySelectorAll("[data-ph]").forEach(inp=>inp.onchange=async()=>{
    const f=inp.files&&inp.files[0]; if(!f) return;
    const itId=inp.dataset.ph; const d=(st.items[itId] ||= {fotos:[],comentario:""});
    try{ const foto=await comprimir(f); d.fotos=[...(d.fotos||[]),foto].slice(0,MAX_FOTOS); tocarSitio(s); guardar(); refrescarItem(s,itId); }
    catch(e){ toast("No se pudo leer la foto. Intenta de nuevo."); }
  });
  $app.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{
    const d=st.items[b.dataset.del]; d.fotos.splice(Number(b.dataset.i),1); guardar(); refrescarItem(s,b.dataset.del);
  });
}
function confirmarSitio(s){
  const st=R.sitios[s.id]; st.fin=new Date().toISOString(); if(!st.inicio) st.inicio=st.fin; st.confirmado=true;
  guardar();
  if(sitiosConfirmados()===SITIOS.length){ cerrarRecorrido(); go({name:"final"}); }
  else { toast(`${s.nombre} terminado`); go({name:"route"}); }
}
function vSiteLocked(s){
  const st=R.sitios[s.id];
  $app.innerHTML = `<section class="site-head"><p class="eyebrow">Sitio ${SITIOS.indexOf(s)+1} de ${SITIOS.length}</p><h2>${esc(s.nombre)}</h2></section>
    <div class="locked">✓ Terminado y bloqueado · <span class="tnum">${hora(st.inicio)} – ${hora(st.fin)}</span></div>
    ${s.items.map(it=>{ const d=st.items[it.id]||{}; const e=ESTADOS[d.estado]||ESTADOS.na;
      return `<div class="ro"><div class="item-sub">${esc(it.cat)} · ${esc(it.sub)}</div>
        <div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><strong>${esc(it.nombre)}</strong><span class="pill ${e.cls}">${e.txt}</span></div>
        ${d.comentario?`<span class="muted">${esc(d.comentario)}</span>`:""}
        ${(d.fotos||[]).length?`<div class="photos">${d.fotos.map(f=>`<div class="ph"><img src="${f.src}" alt=""></div>`).join("")}</div>`:""}</div>`;}).join("")}`;
  const sig=siguienteSitio();
  setFoot(sig?`<button class="btn" id="bSig" type="button">Ir a ${esc(sig.nombre)}</button>`:null);
  if(sig) document.getElementById("bSig").onclick=()=>go({name:"site",id:sig.id});
}

/* ---------- Fotos: reducir tamaño antes de guardar ---------- */
function comprimir(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=rej;
    fr.onload=()=>{
      const img=new Image();
      img.onerror=rej;
      img.onload=()=>{
        const max=1280; let w=img.naturalWidth, h=img.naturalHeight;
        const k=Math.min(1,max/Math.max(w,h)); w=Math.round(w*k); h=Math.round(h*k);
        const c=document.createElement("canvas"); c.width=w; c.height=h;
        c.getContext("2d").drawImage(img,0,0,w,h);
        res({src:c.toDataURL("image/jpeg",0.72), w, h, hora:new Date().toISOString()});
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* ===================== PDF ===================== */
function construirPDF(rec){
  const { jsPDF } = window.jspdf;
  const doc=new jsPDF({unit:"mm",format:"a4"});
  const W=210, M=15, CW=W-2*M, H=297; let y=M;
  const INK=[47,47,14], MUTED=[107,107,82], OLIVE=[154,154,84], OLIVED=[111,111,51], LINE=[227,227,212];
  const nueva=()=>{ doc.addPage(); y=M; };
  const espacio=h=>{ if(y+h>H-18) nueva(); };
  const t=inicioFin(rec); const c=conteos(rec);

  // Encabezado
  try{ doc.addImage(LOGO,"PNG",M,y,48,48*0.31); }catch(e){}
  doc.setFont("helvetica","bold"); doc.setFontSize(16); doc.setTextColor(...INK);
  doc.text("Inspección Master Easement", W-M, y+6, {align:"right"});
  doc.setFont("helvetica","normal"); doc.setFontSize(10); doc.setTextColor(...MUTED);
  doc.text(fechaLarga(rec.fecha), W-M, y+12, {align:"right"});
  y+=22;
  doc.setDrawColor(...OLIVE); doc.setLineWidth(0.6); doc.line(M,y,W-M,y); y+=7;

  // Datos generales
  const datos=[["Inspector",rec.inspector],["Fecha",fechaCorta(rec.fecha)],["Hora de inicio",hora(t.ini)],["Hora de fin",hora(t.fin)]];
  doc.setFontSize(10);
  datos.forEach((d,i)=>{ const x=M+(i%2)*(CW/2); const yy=y+Math.floor(i/2)*7;
    doc.setTextColor(...MUTED); doc.setFont("helvetica","normal"); doc.text(d[0]+":",x,yy);
    doc.setTextColor(...INK); doc.setFont("helvetica","bold"); doc.text(String(d[1]),x+28,yy); });
  y+=17;
  if(rec.ejemplo){ doc.setFont("helvetica","italic"); doc.setFontSize(8.5); doc.setTextColor(...MUTED); doc.text("Versión de prueba con ítems de ejemplo.",M,y); y+=6; }

  // Resumen por sitio
  doc.setFont("helvetica","bold"); doc.setFontSize(12); doc.setTextColor(...OLIVED); doc.text("Resumen por sitio",M,y); y+=5;
  const cols=[["Sitio",58],["Inicio",20],["Fin",20],["Bueno",21],["Malo",21],["Urgente",21],["N/A",19]];
  doc.setFillColor(238,238,221); doc.rect(M,y,CW,7,"F");
  doc.setFontSize(9); doc.setTextColor(...INK); let x=M+2;
  cols.forEach(([h,w])=>{ doc.text(h,x,y+4.8); x+=w; }); y+=7;
  doc.setFont("helvetica","normal");
  SITIOS.forEach(s=>{
    const st=rec.sitios[s.id]; const k={bueno:0,malo:0,urgente:0,na:0};
    s.items.forEach(it=>{ const d=st.items[it.id]; if(d&&d.estado) k[d.estado]++; });
    const row=[s.nombre,hora(st.inicio),hora(st.fin),k.bueno,k.malo,k.urgente,k.na];
    x=M+2; row.forEach((v,i)=>{ if(i===5&&v>0){doc.setTextColor(179,38,30);doc.setFont("helvetica","bold");} doc.text(String(v),x,y+4.8); doc.setTextColor(...INK); doc.setFont("helvetica","normal"); x+=cols[i][1]; });
    y+=7; doc.setDrawColor(...LINE); doc.setLineWidth(0.2); doc.line(M,y,W-M,y);
  });
  doc.setFont("helvetica","bold");
  x=M+2; ["Total","","",c.bueno,c.malo,c.urgente,c.na].forEach((v,i)=>{ doc.text(String(v),x,y+4.8); x+=cols[i][1]; });
  y+=12;

  // Detalle
  SITIOS.forEach(s=>{
    const st=rec.sitios[s.id];
    espacio(22);
    doc.setFillColor(...OLIVE); doc.rect(M,y,CW,9,"F");
    doc.setTextColor(255,255,255); doc.setFont("helvetica","bold"); doc.setFontSize(11.5);
    doc.text(s.nombre,M+3,y+6.2);
    doc.setFont("helvetica","normal"); doc.setFontSize(9.5);
    doc.text(`Inicio ${hora(st.inicio)}  ·  Fin ${hora(st.fin)}`,W-M-3,y+6.2,{align:"right"});
    y+=13;
    s.items.forEach(it=>{
      const d=st.items[it.id]||{}; const e=ESTADOS[d.estado];
      const coment=d.comentario?doc.splitTextToSize(d.comentario,CW-6):[];
      const fotos=d.fotos||[];
      const fotoH=fotos.length?42:0;
      espacio(12+coment.length*4.5+fotoH);
      doc.setFont("helvetica","normal"); doc.setFontSize(8.5); doc.setTextColor(...MUTED);
      doc.text(`${it.cat} / ${it.sub}`,M,y);
      doc.setFont("helvetica","bold"); doc.setFontSize(10.5); doc.setTextColor(...INK);
      doc.text(it.nombre,M,y+5);
      if(e){ const tw=doc.getTextWidth(e.txt)+6; doc.setFillColor(...e.pdf); doc.roundedRect(W-M-tw,y-0.5,tw,7,2,2,"F");
        doc.setTextColor(255,255,255); doc.setFontSize(9); doc.text(e.txt,W-M-tw/2,y+4.2,{align:"center"}); }
      y+=9;
      if(coment.length){ doc.setFont("helvetica","normal"); doc.setFontSize(9.5); doc.setTextColor(...INK); doc.text(coment,M+3,y); y+=coment.length*4.5+1; }
      if(fotos.length){
        let fx=M; const bh=38;
        fotos.forEach(f=>{ const bw=Math.min(56, bh*(f.w/f.h)); const bhh=bw*(f.h/f.w);
          try{ doc.addImage(f.src,"JPEG",fx,y,bw,bhh); }catch(err){}
          doc.setFontSize(7.5); doc.setTextColor(...MUTED); doc.text(hora(f.hora),fx,y+bhh+3.5);
          fx+=bw+4; });
        y+=bh+6;
      }
      doc.setDrawColor(...LINE); doc.setLineWidth(0.2); doc.line(M,y,W-M,y); y+=5;
    });
    y+=3;
  });

  // Pie de página
  const n=doc.getNumberOfPages();
  for(let i=1;i<=n;i++){ doc.setPage(i); doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(...MUTED);
    doc.text(`Hacienda Pinilla · Inspección Master Easement · ${fechaCorta(rec.fecha)} · ${rec.inspector}`,M,H-8);
    doc.text(`Página ${i} de ${n}`,W-M,H-8,{align:"right"}); }
  return doc;
}
async function descargarPDF(rec, btn){
  if(!window.jspdf){ toast("No se pudo cargar el generador de PDF. Revisa la señal y recarga."); return; }
  const txt=btn.textContent; btn.disabled=true; btn.textContent="Generando PDF…";
  try{
    const doc=construirPDF(rec);
    const nombre=`Inspeccion_MasterEasement_${rec.fecha}_${rec.inspector.replace(/[^\wÁÉÍÓÚáéíóúÑñ]+/g,"-")}.pdf`;
    const blob=doc.output("blob");
    let hecho=false;
    // 1) Dentro de claude.ai: guardado con confirmación
    if(window.claude && window.claude.use){
      try{ const dl=await window.claude.use("downloads");
        if(dl){ try{ await dl.save({filename:nombre,data:blob}); toast("PDF listo"); hecho=true; }
          catch(err){ hecho=true; if(err&&err.code==="declined") toast("Descarga cancelada"); else if(err&&err.code==="rate_limited") toast("Espera un momento e intenta de nuevo"); else hecho=false; } } }catch(e){}
    }
    // 2) Celular: menú de compartir (WhatsApp, Archivos, Drive…)
    if(!hecho && navigator.canShare){
      try{ const file=new File([blob],nombre,{type:"application/pdf"});
        if(navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:"Inspección Master Easement"}); hecho=true; } }
      catch(e){ if(e&&e.name==="AbortError") hecho=true; }
    }
    // 3) Navegador normal: descarga directa
    if(!hecho){ const url=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=url; a.download=nombre; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000); toast("PDF descargado"); }
  }catch(e){ toast("No se pudo generar el PDF. Intenta de nuevo."); }
  finally{ btn.disabled=false; btn.textContent=txt; }
}
